version: "3.9"

services:
  fastapi:
    build: .
    container_name: amo_integrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    volumes:
      - tokens_data:/app/tokens
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tokens_data:
